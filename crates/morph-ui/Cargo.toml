[package]
name = "morph-ui"
version = "0.1.0"
edition = "2021"
description = "Compact native popup editor for Morph"
license = "MIT"

[dependencies]
morph-core = { path = "../morph-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.15"

[build-dependencies]
winres = "0.1"
