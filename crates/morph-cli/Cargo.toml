[package]
name = "morph-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface and Windows context menu worker for Morph"
license = "MIT"

[dependencies]
morph-core = { path = "../morph-core" }
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[build-dependencies]
winres = "0.1"

[[bin]]
name = "morph"
path = "src/main.rs"
