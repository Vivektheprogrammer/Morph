[package]
name = "morph-core"
version = "0.1.0"
edition = "2021"
description = "Core conversion engines, registry, format detection, and safe output handling for Morph"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
pdf-writer = "0.12"
lopdf = "0.35"
miniz_oxide = "0.8"
tempfile = "3.17"
winreg = "0.52"

[dev-dependencies]
